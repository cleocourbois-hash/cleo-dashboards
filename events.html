<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ивенты</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #f8f9fb; --surface: #fff; --text: #1a1a2e; --text2: #6b7280;
  --accent: #2563eb; --accent-light: #eff6ff; --border: #e5e7eb;
  --green: #059669; --orange: #d97706; --red: #dc2626;
  --tp: #2563eb; --tp-bg: #dbeafe; --tp-text: #1e40af;
  --jf: #d97706; --jf-bg: #fef3c7; --jf-text: #92400e;
  --both-bg: #ede9fe; --both-text: #5b21b6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1117; --surface: #1a1d2e; --text: #e5e7eb; --text2: #9ca3af;
    --accent: #60a5fa; --accent-light: #1e293b; --border: #2d3348;
    --green: #34d399; --orange: #fbbf24; --red: #f87171;
    --tp-bg: #1e3a5f; --tp-text: #93c5fd;
    --jf-bg: #451a03; --jf-text: #fcd34d;
    --both-bg: #2e1065; --both-text: #c4b5fd;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1117; --surface: #1a1d2e; --text: #e5e7eb; --text2: #9ca3af;
  --accent: #60a5fa; --accent-light: #1e293b; --border: #2d3348;
  --green: #34d399; --orange: #fbbf24; --red: #f87171;
  --tp-bg: #1e3a5f; --tp-text: #93c5fd;
  --jf-bg: #451a03; --jf-text: #fcd34d;
  --both-bg: #2e1065; --both-text: #c4b5fd;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); }
.container { max-width: 1400px; margin: 0 auto; padding: 32px 16px; }
a.back { color: var(--accent); text-decoration: none; font-size: 13px; }
h1 { font-size: 24px; font-weight: 700; margin: 8px 0 4px; }
.subtitle { color: var(--text2); font-size: 13px; margin-bottom: 20px; }

/* --- Two funnel comparison cards --- */
.funnel-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 28px; }
@media (max-width: 768px) { .funnel-compare { grid-template-columns: 1fr; } }
.fc-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 20px 24px; overflow: hidden;
}
.fc-card h2 { font-size: 16px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.fc-card h2 .fc-icon { font-size: 20px; }
.fc-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border); border-radius: 8px; overflow: hidden; }
.fc-metric { background: var(--surface); padding: 14px 12px; text-align: center; }
.fc-metric .fc-label { font-size: 10px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
.fc-metric .fc-val { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.fc-metric .fc-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }
.fc-breakdown { display: flex; gap: 16px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text2); flex-wrap: wrap; }
.fc-breakdown .fc-bp { display: flex; flex-direction: column; }
.fc-breakdown .fc-bp strong { font-size: 15px; color: var(--text); }

/* --- Tabs --- */
.tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.tab {
  padding: 8px 20px; border-radius: 8px; font-size: 14px; font-weight: 500;
  background: var(--surface); border: 1px solid var(--border); cursor: pointer; color: var(--text);
}
.tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.section { display: none; }
.section.visible { display: block; }

/* --- Product toggle --- */
.product-toggle { display: flex; gap: 6px; margin-bottom: 16px; }
.ptog {
  padding: 4px 12px; border-radius: 4px; font-size: 12px;
  background: var(--surface); border: 1px solid var(--border); cursor: pointer; color: var(--text);
}
.ptog.active-tp { background: var(--tp-bg); border-color: var(--tp); color: var(--tp-text); }
.ptog.active-jf { background: var(--jf-bg); border-color: var(--jf); color: var(--jf-text); }
.ptog.active-all { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }

/* --- Tables --- */
.table-wrap { overflow-x: auto; }
#roi-section .table-wrap { max-height: calc(100vh - 260px); overflow-y: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
thead th {
  position: sticky; top: 0; z-index: 10;
  background: var(--surface); text-align: right; padding: 6px 8px;
  border-bottom: 2px solid var(--border); color: var(--text2);
  font-weight: 500; font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.04em; white-space: nowrap;
}
thead th:first-child, thead th:nth-child(2), thead th:nth-child(3), thead th:nth-child(4) { text-align: left; }
td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: right; font-variant-numeric: tabular-nums; }
td:first-child, td:nth-child(2), td:nth-child(3), td:nth-child(4) { text-align: left; }
tr:hover td { background: var(--accent-light); }
tr.month-row td {
  background: var(--surface); font-weight: 700; font-size: 13px;
  border-bottom: 2px solid var(--border); padding: 10px 8px;
  color: var(--accent); text-align: left;
}
tr.month-row:hover td { background: var(--surface); }
tr.totals-row td {
  background: var(--accent-light); font-weight: 600;
  border-top: 2px solid var(--border);
}
tr.totals-row:hover td { background: var(--accent-light); }

.tag { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 11px; font-weight: 500; }
.tag-tp { background: var(--tp-bg); color: var(--tp-text); }
.tag-jf { background: var(--jf-bg); color: var(--jf-text); }
.tag-both { background: var(--both-bg); color: var(--both-text); }
.tag-online { background: #e0f2fe; color: #0369a1; }
.tag-offline { background: #fce7f3; color: #9d174d; }
.tag-hybrid { background: #f0fdf4; color: #15803d; }
.tag-future { background: #dcfce7; color: #166534; }
.tag-past { background: #f3f4f6; color: #6b7280; }

.num-good { color: var(--green); font-weight: 600; }
.num-zero { color: var(--text2); }
.pct { font-size: 10px; color: var(--text2); }
.cost-cell { font-size: 11px; color: var(--text2); }

.verdict-cell { font-size: 11px; max-width: 240px; line-height: 1.3; color: var(--text2); text-align: left; }

/* Column group borders */
.col-sep { border-left: 2px solid var(--border); }

/* --- Outreach section --- */
.outreach-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
.outreach-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px;
}
.outreach-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
.outreach-metric { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.outreach-metric:last-child { border-bottom: none; }
.outreach-metric .label { color: var(--text2); }
.outreach-metric .val { font-weight: 600; font-variant-numeric: tabular-nums; }

/* --- Filters / KPI small --- */
.kpi-row { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
.kpi {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 16px 24px; min-width: 120px; flex: 1;
}
.kpi-label { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
.kpi-value { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }

.filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.filter-btn {
  padding: 4px 12px; border-radius: 4px; font-size: 12px;
  background: var(--surface); border: 1px solid var(--border); cursor: pointer; color: var(--text);
}
.filter-btn.active { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }

/* --- ЕДЕМ months --- */
.month-block { margin-bottom: 16px; }
.month-header {
  display: flex; align-items: center; gap: 8px; padding: 10px 12px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  cursor: pointer; user-select: none;
}
.month-header:hover { border-color: var(--accent); }
.month-header .arrow { font-size: 12px; color: var(--text2); transition: transform 0.15s; width: 16px; }
.month-header.collapsed .arrow { transform: rotate(-90deg); }
.month-header .month-name { font-weight: 600; font-size: 15px; }
.month-header .month-meta { font-size: 12px; color: var(--text2); margin-left: auto; display: flex; gap: 16px; }
.month-body { overflow: hidden; }
.month-body.collapsed { display: none; }

a.site-link { color: var(--accent); text-decoration: none; font-size: 12px; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .tag-online { background: #0c4a6e; color: #7dd3fc; }
  :root:not([data-theme="light"]) .tag-offline { background: #500724; color: #f9a8d4; }
  :root:not([data-theme="light"]) .tag-hybrid { background: #052e16; color: #86efac; }
  :root:not([data-theme="light"]) .tag-future { background: #064e3b; color: #6ee7b7; }
  :root:not([data-theme="light"]) .tag-past { background: #1f2937; color: #9ca3af; }
}
@media (max-width: 640px) {
  .kpi-row { gap: 8px; }
  .kpi { padding: 12px 16px; min-width: 100px; }
  .kpi-value { font-size: 22px; }
  .fc-metric .fc-val { font-size: 20px; }
}
</style>
</head>
<body>
<div class="container">
  <a href="index.html" class="back">&larr; Все дашборды</a>
  <h1>Ивенты</h1>
  <p class="subtitle">Воронка ивентов, аутрич, расписание</p>

  <!-- Two funnel comparison cards -->
  <div class="funnel-compare" id="funnel-compare"></div>

  <div class="tabs">
    <div class="tab active" onclick="showTab('roi')">ROI Анализ</div>
    <div class="tab" onclick="showTab('outreach')">Онлайн аутрич</div>
    <div class="tab" onclick="showTab('edem')">ЕДЕМ</div>
    <div class="tab" onclick="showTab('events')">Все ивенты</div>
  </div>

  <div id="roi-section" class="section visible">
    <div class="product-toggle" id="product-toggle"></div>
    <div class="table-wrap">
      <table id="roi-table"><thead></thead><tbody></tbody></table>
    </div>
  </div>

  <div id="outreach-section" class="section">
    <div class="outreach-grid" id="outreach-grid"></div>
    <h3 style="font-size:15px;font-weight:600;margin-bottom:12px">Топ источников по ответам</h3>
    <div class="table-wrap">
      <table id="outreach-table"><thead></thead><tbody></tbody></table>
    </div>
  </div>

  <div id="edem-section" class="section">
    <div class="kpi-row" id="edem-kpis"></div>
    <div id="edem-months"></div>
  </div>

  <div id="events-section" class="section">
    <div class="kpi-row" id="events-kpis"></div>
    <div class="filters" id="event-filters"></div>
    <div class="table-wrap">
      <table id="events-table"><thead></thead><tbody></tbody></table>
    </div>
  </div>
</div>

<script>
let funnelData, eventsData, edemData, overviewData;
let activeProduct = 'all';
let activeFilter = 'future';

function showTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    const tabs = ['roi','outreach','edem','events'];
    t.classList.toggle('active', tabs[i] === tab);
  });
  ['roi','outreach','edem','events'].forEach(s => {
    document.getElementById(s + '-section').classList.toggle('visible', s === tab);
  });
}

function setProduct(p) {
  activeProduct = p;
  document.querySelectorAll('.ptog').forEach(t => {
    t.className = 'ptog';
    if (t.dataset.p === p) t.classList.add('active-' + p);
  });
  renderROI();
}

const MONTH_MAP = {янв:'01',фев:'02',мар:'03',апр:'04',мая:'05',май:'05',июн:'06',июл:'07',авг:'08',сен:'09',окт:'10',ноя:'11',дек:'12'};
const MONTH_NAMES = {'05':'Май','06':'Июнь','07':'Июль','08':'Август','09':'Сентябрь','10':'Октябрь','11':'Ноябрь','12':'Декабрь'};

function parseMonth(d) {
  if (!d || d.includes('@')) return null;
  const dl = d.toLowerCase();
  for (const [k, v] of Object.entries(MONTH_MAP)) { if (dl.includes(k)) return v; }
  return null;
}
function parseCost(c) {
  if (!c) return 0;
  const s = ('' + c).toLowerCase();
  if (s.includes('бесплатно') || s === '-') return 0;
  const m = s.match(/([\d\s]+)/);
  if (!m) return 0;
  let num = parseInt(m[1].replace(/\s/g, ''), 10);
  if (isNaN(num)) return 0;
  if (s.includes('к') && num < 1000) num *= 1000;
  return num;
}
function nv(v) { return v > 0 ? `<span class="num-good">${v}</span>` : '<span class="num-zero">0</span>'; }
function pct(a, b) { return b > 0 ? (a / b * 100).toFixed(1) + '%' : '-'; }
function costPer(cost, n) { return n > 0 && cost > 0 ? Math.round(cost / n).toLocaleString() + ' ₽' : '-'; }

async function init() {
  [funnelData, eventsData, edemData, overviewData] = await Promise.all([
    fetch('data/event_funnel.json').then(r => r.json()).catch(() => []),
    fetch('data/events.json').then(r => r.json()).catch(() => []),
    fetch('data/edem.json').then(r => r.json()).catch(() => []),
    fetch('data/overview.json').then(r => r.json()).catch(() => null),
  ]);
  renderFunnelCompare();
  renderProductToggle();
  renderROI();
  renderOutreach();
  renderEdem();
  renderEventsKPIs();
  renderEventFilters();
  renderEvents();
}

function renderFunnelCompare() {
  const real = funnelData.filter(r => r.tag && !r.name.includes('ИТОГО'));
  const evMql = real.reduce((s, r) => s + r.mql, 0);
  const evQual = real.reduce((s, r) => s + r.qual, 0);
  const evKp = real.reduce((s, r) => s + r.kp, 0);
  const evContract = real.reduce((s, r) => s + r.contract, 0);
  const evContacts = real.reduce((s, r) => s + r.contacts, 0);
  const evCost = real.reduce((s, r) => s + r.cost, 0);

  const tpMql = real.filter(r => r.product === 'TP').reduce((s, r) => s + r.mql, 0);
  const jfMql = real.filter(r => r.product === 'JF').reduce((s, r) => s + r.mql, 0);
  const tpKp = real.filter(r => r.product === 'TP').reduce((s, r) => s + r.kp, 0);
  const jfKp = real.filter(r => r.product === 'JF').reduce((s, r) => s + r.kp, 0);
  const tpContract = real.filter(r => r.product === 'TP').reduce((s, r) => s + r.contract, 0);
  const jfContract = real.filter(r => r.product === 'JF').reduce((s, r) => s + r.contract, 0);

  const tg = overviewData ? overviewData.tg : {sent:0,replied:0,mql:0,qual:0,kp:0,dogovor:0,sdelka:0};
  const apo = overviewData ? overviewData.apollo : {sent:0,replied:0};
  const outSent = tg.sent + apo.sent;
  const outMql = tg.mql;
  const outKp = tg.kp;
  const outDogovor = tg.dogovor;

  const tpQual = real.filter(r => r.product === 'TP').reduce((s, r) => s + r.qual, 0);
  const jfQual = real.filter(r => r.product === 'JF').reduce((s, r) => s + r.qual, 0);
  const tpEvents = real.filter(r => r.product === 'TP').length;
  const jfEvents = real.filter(r => r.product === 'JF').length;

  document.getElementById('funnel-compare').innerHTML = `
    <div class="fc-card">
      <h2><span class="fc-icon">🎤</span> Ивенты - TalentPay</h2>
      <div class="fc-metrics">
        <div class="fc-metric"><div class="fc-label">MQL</div><div class="fc-val">${tpMql}</div><div class="fc-sub">${tpEvents} ивентов</div></div>
        <div class="fc-metric"><div class="fc-label">КП</div><div class="fc-val">${tpKp}</div><div class="fc-sub">${pct(tpKp, tpMql)} из MQL</div></div>
        <div class="fc-metric"><div class="fc-label">Договор</div><div class="fc-val">${tpContract}</div><div class="fc-sub">${pct(tpContract, tpKp)} из КП</div></div>
      </div>
      <div class="fc-breakdown">
        <div class="fc-bp"><strong>${tpQual}</strong> квалов</div>
        <div class="fc-bp"><strong>${pct(tpQual, tpMql)}</strong> MQL→квал</div>
        <div class="fc-bp"><strong>${pct(tpKp, tpQual)}</strong> квал→КП</div>
      </div>
    </div>
    <div class="fc-card">
      <h2><span class="fc-icon">🎤</span> Ивенты - JustFinTech</h2>
      <div class="fc-metrics">
        <div class="fc-metric"><div class="fc-label">MQL</div><div class="fc-val">${jfMql}</div><div class="fc-sub">${jfEvents} ивентов</div></div>
        <div class="fc-metric"><div class="fc-label">КП</div><div class="fc-val">${jfKp}</div><div class="fc-sub">${pct(jfKp, jfMql)} из MQL</div></div>
        <div class="fc-metric"><div class="fc-label">Договор</div><div class="fc-val">${jfContract}</div><div class="fc-sub">${pct(jfContract, jfKp)} из КП</div></div>
      </div>
      <div class="fc-breakdown">
        <div class="fc-bp"><strong>${jfQual}</strong> квалов</div>
        <div class="fc-bp"><strong>${pct(jfQual, jfMql)}</strong> MQL→квал</div>
        <div class="fc-bp"><strong>${pct(jfKp, jfQual)}</strong> квал→КП</div>
      </div>
    </div>
    <div class="fc-card">
      <h2><span class="fc-icon">💬</span> Онлайн аутрич</h2>
      <div class="fc-metrics">
        <div class="fc-metric"><div class="fc-label">MQL</div><div class="fc-val">${outMql}</div><div class="fc-sub">${outSent.toLocaleString()} отправлено</div></div>
        <div class="fc-metric"><div class="fc-label">КП</div><div class="fc-val">${outKp}</div><div class="fc-sub">${pct(outKp, outMql)} из MQL</div></div>
        <div class="fc-metric"><div class="fc-label">Договор</div><div class="fc-val">${outDogovor}</div><div class="fc-sub">${pct(outDogovor, outKp)} из КП</div></div>
      </div>
      <div class="fc-breakdown">
        <div class="fc-bp"><strong>${tg.sent.toLocaleString()}</strong> TG</div>
        <div class="fc-bp"><strong>${apo.sent.toLocaleString()}</strong> Apollo</div>
        <div class="fc-bp"><strong>${tg.replied}</strong> ответов TG</div>
        <div class="fc-bp"><strong>${tg.qual}</strong> квалов</div>
      </div>
    </div>
  `;
}

function renderProductToggle() {
  document.getElementById('product-toggle').innerHTML = `
    <div class="ptog active-all" data-p="all" onclick="setProduct('all')">Все</div>
    <div class="ptog" data-p="tp" onclick="setProduct('tp')">TalentPay</div>
    <div class="ptog" data-p="jf" onclick="setProduct('jf')">JustFinTech</div>
  `;
}

function renderROI() {
  let data = funnelData;
  if (activeProduct === 'tp') data = data.filter(r => r.product === 'TP');
  if (activeProduct === 'jf') data = data.filter(r => r.product === 'JF');

  const thead = document.querySelector('#roi-table thead');
  const tbody = document.querySelector('#roi-table tbody');

  const colSpan = 18;
  thead.innerHTML = `<tr>
    <th>Ивент</th><th>Дата</th><th>Прод.</th><th>Кто</th>
    <th class="col-sep">Контакты</th><th>Цена/конт.</th>
    <th class="col-sep">MQL</th><th>Цена/MQL</th><th>Конв. конт.→MQL</th>
    <th class="col-sep">Квалов</th><th>Цена/квал</th><th>MQL→квал</th>
    <th class="col-sep">КП</th><th>Цена/КП</th><th>Квал→КП</th>
    <th class="col-sep">Договор</th><th>Цена/дог.</th><th>КП→дог.</th>
  </tr>`;

  tbody.innerHTML = data.map(r => {
    if (r.name.startsWith('🟦') || r.name.startsWith('🟧')) {
      return `<tr class="month-row"><td colspan="${colSpan}">${r.name}</td></tr>`;
    }
    if (r.name === 'ИТОГО') {
      return `<tr class="totals-row">
        <td colspan="4"><strong>ИТОГО</strong></td>
        <td class="col-sep"><strong>${r.contacts.toLocaleString()}</strong></td><td class="cost-cell">${costPer(r.cost, r.contacts)}</td>
        <td class="col-sep"><strong>${r.mql}</strong></td><td class="cost-cell">${costPer(r.cost, r.mql)}</td><td class="pct">${pct(r.mql, r.contacts)}</td>
        <td class="col-sep"><strong>${r.qual}</strong></td><td class="cost-cell">${costPer(r.cost, r.qual)}</td><td class="pct">${pct(r.qual, r.mql)}</td>
        <td class="col-sep"><strong>${r.kp}</strong></td><td class="cost-cell">${costPer(r.cost, r.kp)}</td><td class="pct">${pct(r.kp, r.qual)}</td>
        <td class="col-sep"><strong>${r.contract}</strong></td><td class="cost-cell">${costPer(r.cost, r.contract)}</td><td class="pct">${pct(r.contract, r.kp)}</td>
      </tr>`;
    }

    const prodTag = r.product === 'TP' ? 'tp' : 'jf';

    return `<tr>
      <td><strong>${r.name}</strong></td>
      <td style="white-space:nowrap">${r.date}</td>
      <td><span class="tag tag-${prodTag}">${r.product}</span></td>
      <td>${r.who}</td>
      <td class="col-sep">${r.contacts > 0 ? r.contacts.toLocaleString() : '-'}</td>
      <td class="cost-cell">${costPer(r.cost, r.contacts)}</td>
      <td class="col-sep">${nv(r.mql)}</td>
      <td class="cost-cell">${costPer(r.cost, r.mql)}</td>
      <td class="pct">${pct(r.mql, r.contacts)}</td>
      <td class="col-sep">${nv(r.qual)}</td>
      <td class="cost-cell">${costPer(r.cost, r.qual)}</td>
      <td class="pct">${pct(r.qual, r.mql)}</td>
      <td class="col-sep">${nv(r.kp)}</td>
      <td class="cost-cell">${costPer(r.cost, r.kp)}</td>
      <td class="pct">${pct(r.kp, r.qual)}</td>
      <td class="col-sep">${nv(r.contract)}</td>
      <td class="cost-cell">${costPer(r.cost, r.contract)}</td>
      <td class="pct">${pct(r.contract, r.kp)}</td>
    </tr>`;
  }).join('');
}

function renderOutreach() {
  if (!overviewData) {
    document.getElementById('outreach-grid').innerHTML = '<p style="color:var(--text2)">Нет данных аутрича</p>';
    return;
  }
  const tg = overviewData.tg;
  const apo = overviewData.apollo;
  const replyRate = tg.sent > 0 ? (tg.replied / tg.sent * 100).toFixed(1) : 0;
  const mqlRate = tg.replied > 0 ? (tg.mql / tg.replied * 100).toFixed(1) : 0;

  document.getElementById('outreach-grid').innerHTML = `
    <div class="outreach-card">
      <h3>Telegram (Мартина)</h3>
      <div class="outreach-metric"><span class="label">Отправлено</span><span class="val">${tg.sent.toLocaleString()}</span></div>
      <div class="outreach-metric"><span class="label">Ответили</span><span class="val">${tg.replied} (${replyRate}%)</span></div>
      <div class="outreach-metric"><span class="label">MQL</span><span class="val">${tg.mql}</span></div>
      <div class="outreach-metric"><span class="label">Квалов</span><span class="val">${tg.qual}</span></div>
      <div class="outreach-metric"><span class="label">Звонок</span><span class="val">${tg.zvonok}</span></div>
      <div class="outreach-metric"><span class="label">КП</span><span class="val">${tg.kp}</span></div>
      <div class="outreach-metric"><span class="label">Договор</span><span class="val">${tg.dogovor}</span></div>
      <div class="outreach-metric"><span class="label">MQL/ответ</span><span class="val">${mqlRate}%</span></div>
    </div>
    <div class="outreach-card">
      <h3>Apollo (email)</h3>
      <div class="outreach-metric"><span class="label">Отправлено</span><span class="val">${apo.sent.toLocaleString()}</span></div>
      <div class="outreach-metric"><span class="label">Ответили</span><span class="val">${apo.replied}</span></div>
      <div class="outreach-metric"><span class="label">Открыли</span><span class="val">${apo.opened || '-'}</span></div>
    </div>
  `;

  const sources = (overviewData.sources || [])
    .filter(s => s.replied > 0)
    .sort((a, b) => b.replied - a.replied)
    .slice(0, 15);

  const otHead = document.querySelector('#outreach-table thead');
  const otBody = document.querySelector('#outreach-table tbody');
  otHead.innerHTML = '<tr><th>Источник</th><th>Канал</th><th>Отправлено</th><th>Ответы</th><th>Reply%</th><th>КП</th></tr>';
  otBody.innerHTML = sources.map(s => {
    const rr = s.sent > 0 ? (s.replied / s.sent * 100).toFixed(1) : '0';
    return `<tr>
      <td><strong>${s.name}</strong></td>
      <td>${s.channel}</td>
      <td>${s.sent}</td>
      <td>${nv(s.replied)}</td>
      <td>${rr}%</td>
      <td>${s.kp != null ? nv(s.kp) : '-'}</td>
    </tr>`;
  }).join('');
}

function renderEdem() {
  const valid = edemData.filter(e => parseMonth(e.date));
  const grouped = {};
  valid.forEach(e => {
    const m = parseMonth(e.date);
    if (!grouped[m]) grouped[m] = [];
    grouped[m].push(e);
  });
  const sortedMonths = Object.keys(grouped).sort();

  const totalCost = valid.reduce((s, e) => s + parseCost(e.cost), 0);
  document.getElementById('edem-kpis').innerHTML = `
    <div class="kpi"><div class="kpi-label">Ивентов</div><div class="kpi-value">${valid.length}</div></div>
    <div class="kpi"><div class="kpi-label">Потрачено</div><div class="kpi-value">${totalCost.toLocaleString()} ₽</div></div>
  `;

  const container = document.getElementById('edem-months');
  container.innerHTML = '';

  sortedMonths.forEach(m => {
    const events = grouped[m];
    const monthCost = events.reduce((s, e) => s + parseCost(e.cost), 0);
    const collapsed = m < '09';

    const block = document.createElement('div');
    block.className = 'month-block';
    block.innerHTML = `
      <div class="month-header ${collapsed ? 'collapsed' : ''}" onclick="toggleMonth(this)">
        <span class="arrow">&#9660;</span>
        <span class="month-name">${MONTH_NAMES[m] || m}</span>
        <div class="month-meta">
          <span>${events.length} ивентов</span>
          <span>${monthCost > 0 ? monthCost.toLocaleString() + ' ₽' : 'бесплатно'}</span>
        </div>
      </div>
      <div class="month-body ${collapsed ? 'collapsed' : ''}">
        <table style="width:100%;border-collapse:collapse;font-size:13px;">
          <thead><tr><th style="position:static;text-align:left">Ивент</th><th style="position:static;text-align:left">Дата</th><th style="position:static;text-align:left">ГЕО</th><th style="position:static;text-align:left">Продукт</th><th style="position:static;text-align:left">Сейлз</th><th style="position:static;text-align:left">Билет</th><th style="position:static;text-align:left">Стоимость</th><th style="position:static;text-align:left">Нетворк</th></tr></thead>
          <tbody>${events.map(e => {
            const prodTag = (e.product || '').toLowerCase().includes('tp') && (e.product || '').toLowerCase().includes('jf')
              ? 'both' : (e.product || '').toLowerCase().includes('jf') ? 'jf' : 'tp';
            return `<tr>
              <td style="text-align:left"><strong>${e.name}</strong></td>
              <td style="white-space:nowrap;text-align:left">${e.date}</td>
              <td style="text-align:left">${e.geo}</td>
              <td style="text-align:left"><span class="tag tag-${prodTag}">${e.product}</span></td>
              <td style="text-align:left">${e.sales}</td>
              <td style="text-align:left">${e.ticket}</td>
              <td style="text-align:left">${e.cost}</td>
              <td style="text-align:left">${e.network}</td>
            </tr>`;
          }).join('')}</tbody>
        </table>
      </div>
    `;
    container.appendChild(block);
  });
}

function toggleMonth(header) {
  header.classList.toggle('collapsed');
  header.nextElementSibling.classList.toggle('collapsed');
}

function renderEventsKPIs() {
  const total = eventsData.length;
  const future = eventsData.filter(e => e.timing === 'future').length;
  const okd = eventsData.filter(e => e.ok_andrey === 'TRUE').length;
  document.getElementById('events-kpis').innerHTML = `
    <div class="kpi"><div class="kpi-label">Всего</div><div class="kpi-value">${total}</div></div>
    <div class="kpi"><div class="kpi-label">Предстоящих</div><div class="kpi-value">${future}</div></div>
    <div class="kpi"><div class="kpi-label">OK Андрея</div><div class="kpi-value">${okd}</div></div>
  `;
}

function renderEventFilters() {
  const filters = ['future', 'past', 'all'];
  const labels = {future: 'Предстоящие', past: 'Прошедшие', all: 'Все'};
  document.getElementById('event-filters').innerHTML = filters.map(f =>
    `<div class="filter-btn ${f === activeFilter ? 'active' : ''}" onclick="setFilter('${f}')">${labels[f]}</div>`
  ).join('');
}

function setFilter(f) { activeFilter = f; renderEventFilters(); renderEvents(); }

function renderEvents() {
  let filtered = eventsData;
  if (activeFilter !== 'all') filtered = filtered.filter(e => e.timing === activeFilter);

  const thead = document.querySelector('#events-table thead');
  const tbody = document.querySelector('#events-table tbody');
  thead.innerHTML = '<tr><th style="text-align:left">Дата</th><th style="text-align:left">Мероприятие</th><th style="text-align:left">ГЕО</th><th style="text-align:left">Формат</th><th style="text-align:left">Фокус</th><th style="text-align:left">Сайт</th><th style="text-align:left">OK</th><th style="text-align:left">Решение</th></tr>';
  tbody.innerHTML = filtered.map(e => {
    const fmtTag = (e.format || '').toLowerCase();
    const fmtClass = fmtTag.includes('online') ? 'online' : fmtTag.includes('hybrid') ? 'hybrid' : 'offline';
    const focusTag = (e.focus || '').toLowerCase().includes('tp') && (e.focus || '').toLowerCase().includes('jf')
      ? 'both' : (e.focus || '').toLowerCase().includes('jf') ? 'jf' : 'tp';
    const site = e.site ? `<a class="site-link" href="${e.site}" target="_blank">ссылка</a>` : '';
    const ok = e.ok_andrey === 'TRUE' ? '✅' : '';
    return `<tr>
      <td style="white-space:nowrap;text-align:left">${e.date}</td>
      <td style="text-align:left"><strong>${e.name}</strong></td>
      <td style="text-align:left">${e.geo}</td>
      <td style="text-align:left"><span class="tag tag-${fmtClass}">${e.format}</span></td>
      <td style="text-align:left"><span class="tag tag-${focusTag}">${e.focus}</span></td>
      <td style="text-align:left">${site}</td>
      <td style="text-align:left">${ok}</td>
      <td style="text-align:left">${e.decision}</td>
    </tr>`;
  }).join('');
}

init();
</script>
</body>
</html>
